site_name: md2docx
site_description: Конвертер Markdown → DOCX через AST и OOXML
site_url: https://dexiter11011.github.io/ast-processor/
repo_url: https://github.com/Dexiter11011/ast-processor
repo_name: Dexiter11011/ast-processor
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: ru
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Светлая тема
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search:
      lang:
        - ru
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Главная: index.md
  - Руководство:
    - Введение: user-docs/README.md
    - 01. Установка и запуск: user-docs/01-ustanovka-i-zapusk.md
    - 02. Markdown — основы: user-docs/02-markdown-osnovy.md
    - 03. Таблицы и рисунки: user-docs/03-tablicy-i-risunki.md
    - 04. Навигация и оглавление: user-docs/04-navigaciya-i-oglavlenie.md
    - 05. Поля и колонтитулы: user-docs/05-polya-i-kolontituly.md
    - 06. Темы и шаблоны: user-docs/06-temy-i-shablony.md
    - 07. Корпоративный pipeline: user-docs/07-korporativny-pipeline.md
    - 08. Ограничения и FAQ: user-docs/08-ogranicheniya-i-faq.md
  - Справочник:
    - Публичный API: API.md
    - Обработка ошибок: ERROR_HANDLING.md
    - Плагины: PLUGINS.md
    - Plugin API: PLUGIN_API.md
    - Миграция плагинов: PLUGIN_MIGRATION.md
    - Метаданные документа: DOCUMENT_METADATA.md
    - Шаблоны DOCX: DOCX_TEMPLATES.md
    - Регионы шаблона: TEMPLATE_REGIONS.md
    - Динамические поля: DYNAMIC_FIELDS.md
    - Темы: THEMES.md
    - Внешние темы: EXTERNAL_THEMES.md
    - Система стилей: STYLE_SYSTEM.md
    - Контекст рендеринга: RENDERING_CONTEXT.md
    - Списки и таблицы: LISTS_AND_TABLES.md
    - Секции и макет: SECTIONS_AND_LAYOUT.md
    - Навигация: NAVIGATION.md
    - DSL навигации: MARKDOWN_NAVIGATION_DSL.md
    - Рисунки и ссылки: FIGURES_AND_REFERENCES.md
    - Ссылки и TOC: REFERENCES_AND_TOC.md
    - Совместимость Markdown: MARKDOWN_COMPATIBILITY.md
    - Расширенный Markdown: ADVANCED_MARKDOWN.md
  - Разработка:
    - Матрица тестов: TEST_MATRIX.md
    - Готовность к релизу: RELEASE_READINESS.md
    - Аудит production: PRODUCTION_READINESS_AUDIT.md
    - Аудит Iteration 28: ITERATION_28_AUDIT.md
    - Аудит Iteration 30: ITERATION_30_AUDIT.md
